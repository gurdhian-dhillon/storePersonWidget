<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finishing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container finishing-app">
        <header class="app-header">
            <div class="app-header-left">
                <h1>Finishing</h1>
                <span class="app-date" id="app-date-el"></span>
            </div>
            <div class="app-header-right">
                <!-- Same control, same place as the supervisor and packing screens. -->
                <select id="sup-select" class="sup-select" aria-label="Choose supervisor">
                    <option value="">Loading&hellip;</option>
                </select>
                <button id="refresh-btn" class="primary-btn" type="button" onclick="onRefreshClicked()">Refresh</button>
            </div>
        </header>

        <!-- Two tabs, same as the checker screen. The count on "To finish" is the
             point of the strip: it says whether there is anything to do without
             him having to open it. -->
        <nav class="tab-strip" id="tab-strip">
            <button type="button" class="tab-btn is-active" data-tab="queue" onclick="switchTab('queue')">
                To finish<span class="tab-count hidden" id="count-queue"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="history" onclick="switchTab('history')">
                History
            </button>
        </nav>

        <main class="tab-body">
            <!-- Everything inside both panels is GENERATED by js/main.js, so this
                 page stays a shell and the rendering lives in one place. -->
            <section class="tab-panel is-active" id="panel-queue">
                <div class="fin-count" id="queue-count"></div>
                <div class="fin-queue" id="queue-list"></div>
            </section>

            <section class="tab-panel" id="panel-history">
                <div class="fin-history" id="history-list"></div>
            </section>
        </main>
    </div>

    <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
