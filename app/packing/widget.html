<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container packing-app">
        <header class="app-header">
            <div class="app-header-left">
                <h1>Packing</h1>
                <span class="app-date" id="pack-date"></span>
            </div>
            <div class="app-header-right">
                <!-- Same place as every other screen: picker then Refresh. -->
                <select id="pack-sup-select" class="sup-select" aria-label="Choose supervisor">
                    <option value="">Choose supervisor&hellip;</option>
                </select>
                <button class="primary-btn" type="button" onclick="PackingScreen.refresh()">Refresh</button>
            </div>
        </header>

        <!-- Everything below is GENERATED by js/main.js - this page carries only
             the count line and an empty list. Ids are prefixed "pack-". -->
        <div class="packing-panel">
            <div class="pack-count" id="pack-queue-count"></div>
            <div class="pack-queue" id="pack-queue-list"></div>
        </div>
    </div>

    <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () { PackingScreen.init(); }, 150);
        });
    </script>
</body>
</html>
