<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container packing-app">
        <header class="app-header">
            <div class="app-header-left">
                <h1>Packing</h1>
                <span class="app-date" id="pack-date"></span>
            </div>
            <div class="app-header-right">
                <!-- Same place as every other screen: picker then Refresh. -->
                <select id="pack-sup-select" class="sup-select" aria-label="Choose supervisor">
                    <option value="">Choose supervisor&hellip;</option>
                </select>
                <button class="primary-btn" type="button" onclick="PackingScreen.refresh()">Refresh</button>
            </div>
        </header>

        <!-- TWO TABS, the same shape and the same classes as the store screen:
             the job, then what was already done. tab-strip / tab-btn / tab-panel
             come from the shared stylesheet, so this reads as one product rather
             than a third take on a tab.

             History is LAZY - PackingScreen fetches it the first time it is
             opened, so arriving at the queue does not pay for it. Both tabs are
             filtered by the supervisor picker in the header. -->
        <nav class="tab-strip" id="pack-tab-strip">
            <button type="button" class="tab-btn is-active" data-packtab="queue">
                To pack<span class="tab-count" id="pack-count-queue"></span>
            </button>
            <button type="button" class="tab-btn" data-packtab="history">
                History<span class="tab-count" id="pack-count-history"></span>
            </button>
        </nav>

        <!-- Everything below is GENERATED by js/main.js - this page carries only
             the count lines and empty lists. Ids are prefixed "pack-". -->
        <div class="tab-panel is-active" id="pack-panel-queue">
            <div class="packing-panel">
                <div class="pack-count" id="pack-queue-count"></div>
                <div class="pack-queue" id="pack-queue-list"></div>
            </div>
        </div>

        <div class="tab-panel" id="pack-panel-history">
            <div class="packing-panel">
                <div class="pack-count" id="pack-history-count"></div>
                <div class="pack-queue" id="pack-history-list"></div>
            </div>
        </div>
    </div>

    <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () { PackingScreen.init(); }, 150);
        });
    </script>
</body>
</html>
