<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <header class="app-header">
            <div class="app-header-left">
                <h1>Store</h1>
                <span class="app-date" id="app-date"></span>
            </div>

            <div class="app-header-right">
                <span class="header-sub" id="header-sub"></span>
                <button id="refresh-btn" class="primary-btn" type="button">Refresh</button>
            </div>
        </header>

        <!-- Tab strip. Counts are filled from the boot fetch, not separate
             calls — a badge is not worth a round trip of its own.

             ORDER IS THE DAY'S ORDER, and it is only markup — showTab, the
             panels and TAB_LOADERS are all keyed by data-tab, so moving a
             button moves the tab and nothing else needs to know.

             Issue first because it is the home tab and the job. Then the four
             that answer for it — what went out, what came back, what is in
             dispute, what was asked for. Then the two reference lists. Print
             is LAST: it is a side errand for one material at a time, not part
             of the handover chain, and sitting at position two it separated
             Issue from the History of that same issuing. -->
        <nav class="tab-strip" id="tab-strip">
            <button type="button" class="tab-btn is-active" data-tab="issue">
                Issue<span class="tab-count" id="count-issue"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="history">
                History
            </button>
            <button type="button" class="tab-btn" data-tab="waste">
                Waste receipt<span class="tab-count" id="count-waste"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="disputes">
                Disputes<span class="tab-count" id="count-disputes"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="requests">
                My requests<span class="tab-count" id="count-requests"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="materials">
                Raw materials
            </button>
            <button type="button" class="tab-btn" data-tab="stockin">
                Unallocated quantity
            </button>
            <!-- Print Fabric tab hidden for now. The panel, its loader and
                 print-data.js stay wired so re-showing is just un-hiding this. -->
            <button type="button" class="tab-btn" data-tab="print" hidden>
                Print Fabric
            </button>
        </nav>

        <main class="tab-body">

            <section class="tab-panel is-active" id="panel-issue">
                <div class="empty-state hidden" id="empty-state">
                    <h2>No pending requirements</h2>
                    <p>There are no supervisors with pending material requirements right now.</p>
                </div>
                <div id="dynamic-content"></div>
            </section>

            <!-- Kept in strip order. Only one is ever visible, so this order
                 changes nothing on screen — it is so the two lists can be read
                 against each other. -->
            <section class="tab-panel" id="panel-history"></section>
            <section class="tab-panel" id="panel-waste"></section>
            <section class="tab-panel" id="panel-disputes"></section>
            <section class="tab-panel" id="panel-requests"></section>
            <section class="tab-panel" id="panel-materials"></section>
            <section class="tab-panel" id="panel-stockin"></section>
            <section class="tab-panel" id="panel-print"></section>

        </main>

    </div>

    <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <!-- BEFORE EVERY getRecords-based script. Wraps ZOHO.CREATOR.DATA.getRecords
         with a concurrency cap + 2955 retry — api-experiment.js alone opens with
         8 simultaneous getRecords cursor walks, which trips Creator's "too many
         API calls initiated at once" limit under load. -->
    <script src="js/data-throttle.js"></script>
    <script src="js/lot-allocator.js"></script>
    <!-- Store material requirements — the live read path (JS Data API).
         Replaces the retired getStoreMaterialRequirements function.
         MUST load before main.js: loadRequirements() calls ApiExperiment.run(). -->
    <script src="js/api-experiment.js"></script>
    <!-- Print tab read side — JS Data API, replaces getPrintData.dg.
         MUST load before main.js: loadPrint() calls PrintData.load(). -->
    <script src="js/print-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
