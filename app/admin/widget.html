<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Order audit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <header class="app-header">
            <div class="app-header-left">
                <h1>Order audit</h1>
                <span class="app-date" id="app-date"></span>
            </div>

            <div class="app-header-right">
                <!-- Filters the picker, it does not search the data. Matches the
                     order number, its source and its status. -->
                <input id="so-filter" class="so-filter" type="search" autocomplete="off"
                       placeholder="Filter orders…" aria-label="Filter sales orders">
                <select id="so-select" class="sup-select" aria-label="Choose sales order">
                    <option value="">Choose sales order…</option>
                </select>
                <!-- Orders with no plan never appear here. Selecting one could
                     only show an empty state, and why it was not planned (no BOM,
                     no supervisor rule) is not a question this screen answers. -->
                <span id="so-count" class="so-count"></span>
                <button id="refresh-btn" class="primary-btn" type="button">Refresh</button>
            </div>
        </header>

        <!-- One order picker, two questions about it. Both tabs read the same
             selected order, so switching does not make you find it again. -->
        <nav class="tab-strip" id="tab-strip">
            <button type="button" class="tab-btn is-active" data-tab="calc">Calculation check</button>
            <button type="button" class="tab-btn" data-tab="used">Material used</button>
        </nav>

        <div class="tab-panel is-active" id="panel-calc">

        <!-- THE GLOSSARY OF THE FOUR STEPS USED TO LIVE HERE, as four cards
             taking a full screen height above the data. It said the same thing
             on every order, every item, every row, for ever — so the admin paid
             a screenful to be told, again, what the columns mean.

             The steps still carry their numbered tags and their colours, which
             is what the cards were really keying. What the numbers MEAN is now
             said where it can be acted on: a mismatch states its case in full,
             an agreement is a tick. -->

        <main id="content"></main>

        <div class="empty-state" id="empty">
            <div class="icon">🧮</div>
            <h2>Pick a sales order</h2>
            <p>Every fabric line on it will be broken down step by step.</p>
        </div>

        </div><!-- /panel-calc -->

        <!-- WHAT THE ORDER ACTUALLY ATE, as opposed to what it was planned to.
             Loaded lazily on first open: it is its own Custom API, deliberately
             not folded into getAdminCalculation, which already calls two other
             functions through thisapp and is the heaviest call in the app. -->
        <div class="tab-panel" id="panel-used"></div>

    </div>

    <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <!-- BEFORE EVERY getRecords-based script — see app/js/data-throttle.js. -->
    <script src="../js/data-throttle.js"></script>
    <script src="../js/lot-allocator.js"></script>
    <script src="../js/api-experiment.js"></script>
    <!-- The reason trail behind extra material demand. A pure read over the JS
         Data API — Material_Requirement.Reason, Plan_Item.Remake_Reason and
         Item_Check.Rejection_Remarks — none of which getOrderConsumption
         returns. Loaded before main.js, which calls it. -->
    <script src="js/consumption-detail.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
